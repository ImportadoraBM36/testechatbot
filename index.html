
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BM36 | Atendimento</title>
  <link rel="stylesheet" href="chatbot/style.css">
</head>
<body>
  <main class="phone" aria-label="Atendimento BM36">
    <header class="top">
      <div class="avatar">BM</div>
      <div>
        <div class="title">BM36</div>
        <div class="status" id="status">Assistente online</div>
      </div>
    </header>

    <section id="conversa" aria-live="polite">
      <div class="day">Hoje</div>
    </section>

    <form class="inputbar" id="form">
      <input
        id="mensagem"
        autocomplete="off"
        placeholder="Digite sua mensagem"
        aria-label="Mensagem"
      >
      <button id="enviar" aria-label="Enviar mensagem">➤</button>
    </form>
  </main>

  <script src="chatbot/script.js"></script>
</body>
</html>
